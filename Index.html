<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - MuEmu Config</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { dark: '#0f172a', card: '#1e293b', accent: '#06b6d4', purple: '#a855f7', 'purple-accent': '#c084fc' } } }
        }
    </script>
    <style>body { background-color: #0f172a; color: #ffffff; } .card { background-color: #1e293b; }</style>
</head>
<body class="min-h-screen flex flex-col font-sans">
    <nav class="bg-slate-900 border-b border-slate-700 p-4">
        <div class="max-w-7xl mx-auto flex items-center">
            <span class="text-2xl font-bold text-purple-accent">MuEmu</span>
            <span class="text-2xl font-bold text-white ml-1">Config</span>
        </div>
    </nav>

    <main class="flex-grow max-w-4xl mx-auto w-full px-4 py-8">
        <h1 class="text-3xl font-extrabold mb-6">Herramientas Disponibles</h1>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <!-- Tarjeta de la Calculadora -->
            <div class="card rounded-2xl shadow-xl p-6 border border-slate-700 transition transform hover:-translate-y-1">
                <h2 class="text-xl font-bold text-accent mb-2">Calculadora de Drop</h2>
                <p class="text-slate-400 mb-4">Genera líneas perfectas para el DropManager.txt con las tabulaciones exactas.</p>
                <a href="herramientas/muemu-drop.html" class="inline-block w-full text-center bg-purple-500 hover:bg-purple-600 text-white font-bold py-3 rounded-lg transition">
                    Abrir Calculadora

            </div>
        </div>
    </main>
</body>
</html>
