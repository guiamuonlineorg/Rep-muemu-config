<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In-Game Shop (X) Pro - MuEmu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        mu: { dark: '#0a0a0f', card: '#12131a', border: '#2a2b3d', gold: '#d4af37', purple: '#a855f7' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'], title: ['Cinzel', 'serif'], mono: ['Fira Code', 'monospace'] }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0f; }
        ::-webkit-scrollbar-thumb { background: #2a2b3d; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #d4af37; }
        
        .btn-glow { box-shadow: 0 0 15px rgba(168, 85, 247, 0.4); transition: all 0.2s; }
        .btn-glow:hover { box-shadow: 0 0 25px rgba(168, 85, 247, 0.7); transform: translateY(-1px); }
        .btn-glow:active { transform: scale(0.98); }

        .btn-glow-blue {
            background-color: #0891b2; color: #ffffff;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.6), inset 0 0 8px rgba(255, 255, 255, 0.2);
            transition: all 0.2s ease-in-out;
        }
        .btn-glow-blue:hover {
            background-color: #0e7490; box-shadow: 0 0 6px rgba(6, 182, 212, 0.3); opacity: 0.9;
        }
        .btn-glow-blue:active {
            background-color: #c026d3 !important; box-shadow: 0 0 25px rgba(217, 70, 239, 0.9) !important; transform: scale(0.95);
        }

        .btn-glow-green { box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); transition: all 0.2s; }
        .btn-glow-green:hover { box-shadow: 0 0 25px rgba(16, 185, 129, 0.7); transform: translateY(-1px); }
        .btn-glow-green:active { transform: scale(0.98); }

        .hidden-safe { display: none !important; }
    </style>
</head>
<body class="bg-mu-dark text-gray-200 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-mu-card border-b border-mu-border sticky top-0 z-50 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-purple-600 to-indigo-800 flex items-center justify-center text-white text-xl shadow-md">
                    <i class="fa-solid fa-store"></i>
                </div>
                <div>
                    <h1 class="font-title text-lg font-bold text-mu-purple">Cash Shop Interactive</h1>
                    <p class="text-xs text-gray-400 font-mono">Generador Avanzado In-Game</p>
                </div>
            </div>
            <a href="/muemu.config/index.html" class="btn-glow-blue px-3 py-1.5 text-sm font-bold rounded-lg flex items-center space-x-2">
                <i class="fa-solid fa-house"></i>
                <span class="hidden sm:inline">Inicio</span>
            </a>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6 space-y-6">
        
        <!-- Interactive Form -->
        <div class="bg-mu-card border border-mu-border rounded-xl p-5 shadow-lg">
            <div class="flex justify-between items-center mb-4 border-b border-mu-border pb-2">
                <h2 class="font-title text-mu-gold font-bold flex items-center">
                    <i class="fa-solid fa-hammer mr-2"></i> Forjador de Ítems para la Tienda
                </h2>
                <div id="editBadge" class="hidden-safe bg-emerald-500/20 text-emerald-400 text-xs font-bold px-3 py-1 rounded-full border border-emerald-500/30">
                    <i class="fa-solid fa-pen-to-square mr-1"></i> Modo Edición
                </div>
            </div>
            
            <form id="shopForm" class="space-y-4">
                
                <!-- PASO 1 y 2 en Grid -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                    
                    <!-- PASO 1: UBICACIÓN VISUAL -->
                    <div class="p-4 bg-mu-dark/50 rounded-lg border border-mu-border/50">
                        <label class="block text-xs font-bold text-mu-purple mb-3 uppercase tracking-wider">
                            <i class="fa-regular fa-map mr-1"></i> 1. Ubicación Visual (Interfaz Tienda)
                        </label>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-gray-400 mb-1">Solapa Superior</label>
                                <select id="shopTab" class="w-full bg-mu-dark border border-mu-border rounded p-2 text-sm text-white focus:border-mu-purple outline-none">
                                    <option value="1">1 - WCoins (Premium)</option>
                                    <option value="2">2 - Goblin Points (Free)</option>
                                    <option value="3">3 - Especial / Eventos</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-400 mb-1">Menú Izquierdo</label>
                                <select id="shopMenu" class="w-full bg-mu-dark border border-mu-border rounded p-2 text-sm text-white focus:border-mu-purple outline-none">
                                    <option value="1">1 - Equipamiento / Sets</option>
                                    <option value="2">2 - Armas / Escudos</option>
                                    <option value="3">3 - Mascotas / Pets</option>
                                    <option value="4">4 - Consumibles / Joyas</option>
                                    <option value="5">5 - Scrolls / Buffs</option>
                                    <option value="6">6 - Tickets / Entradas</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- PASO 2: SELECCIÓN DE ÍTEM -->
                    <div class="p-4 bg-mu-dark/50 rounded-lg border border-mu-border/50">
                        <label class="block text-xs font-bold text-blue-400 mb-3 uppercase tracking-wider">
                            <i class="fa-solid fa-cube mr-1"></i> 2. Ítem de la Base de Datos
                        </label>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-gray-400 mb-1">Tipo (Category)</label>
                                <select id="itemType" class="w-full bg-mu-dark border border-mu-border rounded p-2 text-sm text-white focus:border-blue-400 outline-none">
                                    <option value="0">0 - Espadas (Swords)</option>
                                    <option value="1">1 - Hachas (Axes)</option>
                                    <option value="2">2 - Mazos/Cetros (Maces)</option>
                                    <option value="3">3 - Lanzas (Spears)</option>
                                    <option value="4">4 - Arcos/Ballestas (Bows)</option>
                                    <option value="5">5 - Bastones (Staffs)</option>
                                    <option value="6">6 - Escudos (Shields)</option>
                                    <option value="7">7 - Cascos (Helms)</option>
                                    <option value="8">8 - Armaduras (Armors)</option>
                                    <option value="9">9 - Pantalones (Pants)</option>
                                    <option value="10">10 - Guantes (Gloves)</option>
                                    <option value="11">11 - Botas (Boots)</option>
                                    <option value="12">12 - Alas (Wings)</option>
                                    <option value="13">13 - Anillos/Pets/Acces.</option>
                                    <option value="14" selected>14 - Joyas y Pociones</option>
                                    <option value="15">15 - Scroll / Poderes</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-400 mb-1">Ítem (Index)</label>
                                <select id="itemIndex" class="w-full bg-mu-dark border border-mu-border rounded p-2 text-sm text-white focus:border-blue-400 outline-none">
                                    <!-- Inyectado por JS -->
                                </select>
                            </div>
                        </div>
                    </div>

                </div>

                <!-- PASO 3: STATS DINÁMICOS -->
                <div class="p-4 bg-mu-dark/50 rounded-lg border border-mu-border/50">
                    <label class="block text-xs font-bold text-gray-300 mb-3 uppercase tracking-wider">
                        <i class="fa-solid fa-sliders mr-1"></i> 3. Propiedades del Ítem
                    </label>
                    <div id="statsContainer" class="grid grid-cols-2 md:grid-cols-6 gap-4">
                        <div id="boxLevel">
                            <label class="block text-xs font-semibold text-gray-400 mb-1">Nivel (+0 a +15)</label>
                            <input type="number" id="level" value="0" min="0" max="15" class="w-full bg-mu-dark border border-mu-border rounded p-2 text-sm text-center text-white focus:border-mu-purple outline-none">
                        </div>
                        <div id="boxQuantity" class="hidden-safe">
                            <label class="block text-xs font-semibold text-emerald-400 mb-1">Cantidad / Dur</label>
                            <input type="number" id="durability" value="1" min="1" max="255" class="w-full bg-mu-dark border border-emerald-500/50 rounded p-2 text-sm text-center text-white focus:border-emerald-400 outline-none">
                        </div>
                        <div id="boxSkill">
                            <label class="block text-xs font-semibold text-gray-400 mb-1">Skill</label>
                            <select id="skill" class="w-full bg-mu-dark border border-mu-border rounded p-2 text-sm text-white">
                                <option value="0">No</option><option value="1">Sí</option>
                            </select>
                        </div>
                        <div id="boxLuck">
                            <label class="block text-xs font-semibold text-gray-400 mb-1">Luck</label>
                            <select id="luck" class="w-full bg-mu-dark border border-mu-border rounded p-2 text-sm text-white">
                                <option value="0">No</option><option value="1">Sí</option>
                            </select>
                        </div>
                        <div id="boxOption">
                            <label class="block text-xs font-semibold text-gray-400 mb-1">Opción Life</label>
                            <select id="option" class="w-full bg-mu-dark border border-mu-border rounded p-2 text-sm text-white">
                                <option value="0">+0</option><option value="1">+4</option><option value="2">+8</option>
                                <option value="3">+12</option><option value="4">+16</option><option value="5">+20</option>
                                <option value="6">+24</option><option value="7">+28</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 mb-1" title="0 para infinito">Días (Periodo)</label>
                            <input type="number" id="period" value="0" min="0" class="w-full bg-mu-dark border border-mu-border rounded p-2 text-sm text-center text-white focus:border-mu-purple outline-none">
                        </div>
                    </div>

                    <!-- OPCIONES EXCELENTES -->
                    <div id="excContainer" class="hidden-safe mt-4 p-3 bg-purple-900/10 rounded-lg border border-purple-500/30">
                        <label class="block text-xs font-bold text-mu-purple mb-2">Opciones Excelentes Múltiples</label>
                        <div id="excOptionsGrid" class="grid grid-cols-2 md:grid-cols-3 gap-3 text-sm">
                            <!-- Inyectado por JS -->
                        </div>
                    </div>
                </div>

                <!-- PASO 4: PRECIO -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 p-4 bg-mu-dark/50 rounded-lg border border-mu-gold/30">
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-1">Moneda de Pago</label>
                        <select id="coinType" class="w-full bg-mu-dark border border-mu-border rounded p-2 text-sm text-white focus:border-mu-gold outline-none">
                            <option value="0">WCoinC (Paga)</option>
                            <option value="1">WCoinP (Premios)</option>
                            <option value="2">Goblin Points (Juego)</option>
                        </select>
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-xs font-bold text-mu-gold mb-1">Precio Final</label>
                        <div class="flex">
                            <span class="inline-flex items-center px-3 bg-mu-border border border-r-0 border-mu-gold rounded-l-md text-gray-400">
                                <i class="fa-solid fa-coins text-mu-gold"></i>
                            </span>
                            <input type="number" id="price" class="flex-1 bg-mu-dark border border-mu-gold rounded-none rounded-r-md p-2 text-white font-bold focus:outline-none" required placeholder="Ej: 1500">
                        </div>
                    </div>
                </div>

                <!-- Submit & Cancel -->
                <div class="flex space-x-3">
                    <button type="button" id="btnSave" class="btn-glow flex-1 bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold py-3 rounded-xl">
                        <i class="fa-solid fa-cart-plus mr-2"></i> Publicar Ítem en la Tienda
                    </button>
                    <button type="button" id="btnCancelEdit" onclick="cancelEdit()" class="hidden-safe px-4 bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 rounded-xl transition">
                        Cancelar
                    </button>
                </div>
            </form>
        </div>

        <!-- Table View -->
        <div class="bg-mu-card border border-mu-border rounded-xl shadow-lg overflow-hidden">
            <div class="p-4 border-b border-mu-border flex justify-between items-center flex-wrap gap-2">
                <h2 class="font-title text-gray-200 font-bold">Resumen de Ventas Configurado</h2>
                <div class="flex space-x-2">
                    <input type="file" id="fileInput" class="hidden" accept=".txt" onchange="importShopFile(event)">
                    <button onclick="document.getElementById('fileInput').click()" class="px-4 py-2 bg-blue-600 text-white font-bold text-xs rounded hover:bg-blue-500 transition shadow-lg flex items-center">
                        <i class="fa-solid fa-upload mr-2"></i> Importar .txt
                    </button>
                    <button onclick="downloadShopFile()" class="px-4 py-2 bg-mu-gold text-black font-bold text-xs rounded hover:bg-yellow-500 transition shadow-lg flex items-center">
                        <i class="fa-solid fa-download mr-2"></i> Exportar (.txt)
                    </button>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs font-mono text-gray-300">
                    <thead class="bg-mu-dark text-gray-400 uppercase tracking-wider border-b border-mu-border">
                        <tr>
                            <th class="p-3">Solapa</th>
                            <th class="p-3 text-mu-purple">Menú Izq.</th>
                            <th class="p-3">Tipo</th>
                            <th class="p-3">Index</th>
                            <th class="p-3">Nombre</th>
                            <th class="p-3">Lvl</th>
                            <th class="p-3">Cant</th>
                            <th class="p-3">Sk/Lk/Op</th>
                            <th class="p-3">Exc</th>
                            <th class="p-3 text-mu-gold">Moneda</th>
                            <th class="p-3 text-mu-gold">Precio</th>
                            <th class="p-3 text-right">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="shopTableBody" class="divide-y divide-mu-border/60">
                        <!-- Items inyectados -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

        const EXC_ARMOR_OPTIONS = [
            {val: 1, label: "Zen Drop +30%"}, {val: 2, label: "Defense Rate +10%"}, {val: 4, label: "Reflect Dmg +5%"},
            {val: 8, label: "Dmg Decrease +4%"}, {val: 16, label: "Max Mana +4%"}, {val: 32, label: "Max HP +4%"}
        ];
        const EXC_WEAPON_OPTIONS = [
            {val: 1, label: "Kill +Mana/8"}, {val: 2, label: "Kill +Life/8"}, {val: 4, label: "Attack Speed +7"},
            {val: 8, label: "Damage +2%"}, {val: 16, label: "Dmg +Level/20"}, {val: 32, label: "Exc Dmg +10%"}
        ];

        let activeItems = [];
        let editIndex = -1; // -1 significa crear nuevo, >= 0 significa editando

        const selItemType = document.getElementById('itemType');
        const selItemIndex = document.getElementById('itemIndex');
        
        document.addEventListener('DOMContentLoaded', () => {
            selItemType.addEventListener('change', updateFormUI);
            selItemIndex.addEventListener('change', handleManualInput);
            document.getElementById('btnSave').addEventListener('click', saveItem);
            updateFormUI();
        });

        function handleManualInput(e) {
            if(e.target.value === "custom") {
                const manualId = prompt("Ingresá el ID numérico del ítem (Index):");
                if(manualId && !isNaN(manualId)) {
                    const newOpt = document.createElement('option');
                    newOpt.value = manualId;
                    newOpt.textContent = `${manualId} - Custom ID`;
                    newOpt.selected = true;
                    selItemIndex.insertBefore(newOpt, selItemIndex.querySelector('option[value="custom"]'));
                } else {
                    selItemIndex.selectedIndex = 0;
                }
            }
        }

        function updateFormUI(editingItemExc = 0) {
            const cat = parseInt(selItemType.value);
            selItemIndex.innerHTML = "";
            const itemsList = ITEM_DB[cat] || [{id: 0, name: "Ítem Personalizado"}];
            
            itemsList.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item.id;
                opt.textContent = `${item.id} - ${item.name}`;
                selItemIndex.appendChild(opt);
            });
            const customOpt = document.createElement('option');
            customOpt.value = "custom";
            customOpt.textContent = "+ Ingresar ID Manual...";
            selItemIndex.appendChild(customOpt);

            const isJewelOrConsumable = (cat === 14 || cat === 15);
            const isArmor = (cat >= 6 && cat <= 11);
            const isWeapon = (cat >= 0 && cat <= 5);
            const isRingOrPet = (cat === 13);

            if (isJewelOrConsumable) {
                document.getElementById('boxSkill').classList.add('hidden-safe');
                document.getElementById('boxLuck').classList.add('hidden-safe');
                document.getElementById('boxOption').classList.add('hidden-safe');
                document.getElementById('boxLevel').classList.add('hidden-safe');
                document.getElementById('boxQuantity').classList.remove('hidden-safe');
            } else {
                document.getElementById('boxSkill').classList.remove('hidden-safe');
                document.getElementById('boxLuck').classList.remove('hidden-safe');
                document.getElementById('boxOption').classList.remove('hidden-safe');
                document.getElementById('boxLevel').classList.remove('hidden-safe');
                if(isRingOrPet) document.getElementById('boxQuantity').classList.remove('hidden-safe');
                else document.getElementById('boxQuantity').classList.add('hidden-safe');
            }

            const excContainer = document.getElementById('excContainer');
            const excGrid = document.getElementById('excOptionsGrid');
            
            if (isWeapon || isArmor || isRingOrPet) {
                excContainer.classList.remove('hidden-safe');
                excGrid.innerHTML = '';
                const optionsArray = (isArmor || isRingOrPet) ? EXC_ARMOR_OPTIONS : EXC_WEAPON_OPTIONS;
                
                optionsArray.forEach(op => {
                    const isChecked = (editingItemExc & op.val) !== 0 ? "checked" : "";
                    excGrid.innerHTML += `
                        <label class="flex items-center space-x-2 text-gray-300 cursor-pointer hover:text-white">
                            <input type="checkbox" class="exc-checkbox form-checkbox rounded text-mu-purple" value="${op.val}" ${isChecked}>
                            <span>${op.label}</span>
                        </label>`;
                });
            } else {
                excContainer.classList.add('hidden-safe');
                excGrid.innerHTML = '';
            }
        }

        function saveItem() {
            const priceInput = document.getElementById('price');
            if(!priceInput.value) { alert("Ingresá un precio válido."); priceInput.focus(); return; }

            const cat = parseInt(selItemType.value);
            let excValue = 0;
            document.querySelectorAll('.exc-checkbox:checked').forEach(cb => excValue += parseInt(cb.value));

            const selectedText = selItemIndex.options[selItemIndex.selectedIndex].text;
            const itemName = selectedText.includes(' - ') ? selectedText.split(' - ')[1] : selectedText;
            const isJewel = (cat === 14 || cat === 15);

            const newItem = {
                shopTab: document.getElementById('shopTab').value,
                shopMenu: document.getElementById('shopMenu').value,
                itemType: cat,
                itemIndex: selItemIndex.value,
                name: itemName,
                level: isJewel ? 0 : document.getElementById('level').value,
                durability: (isJewel || cat === 13) ? document.getElementById('durability').value : 0,
                skill: isJewel ? 0 : document.getElementById('skill').value,
                luck: isJewel ? 0 : document.getElementById('luck').value,
                option: isJewel ? 0 : document.getElementById('option').value,
                exc: excValue,
                period: document.getElementById('period').value,
                coin: document.getElementById('coinType').value,
                price: priceInput.value
            };

            if (editIndex > -1) {
                activeItems[editIndex] = newItem;
                cancelEdit(); 
            } else {
                activeItems.push(newItem);
                document.getElementById('shopForm').reset();
                updateFormUI();
            }
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('shopTableBody');
            tbody.innerHTML = activeItems.map((item, idx) => {
                const coinName = item.coin == 0 ? "WCoinC" : (item.coin == 1 ? "WCoinP" : "GoblinP");
                return `
                    <tr class="hover:bg-mu-border/30 transition ${editIndex === idx ? 'bg-emerald-900/20' : ''}">
                        <td class="p-3 font-bold text-gray-300 text-center">${item.shopTab}</td>
                        <td class="p-3 font-bold text-mu-purple text-center">${item.shopMenu}</td>
                        <td class="p-3 text-center">${item.itemType}</td>
                        <td class="p-3 text-center">${item.itemIndex}</td>
                        <td class="p-3 text-white font-semibold truncate max-w-[120px]">${item.name}</td>
                        <td class="p-3 text-center">+${item.level}</td>
                        <td class="p-3 text-emerald-400 text-center">${item.durability > 0 ? item.durability : '-'}</td>
                        <td class="p-3 text-gray-400 text-center">${item.skill}/${item.luck}/${item.option}</td>
                        <td class="p-3 text-center ${item.exc > 0 ? 'text-green-400 font-bold' : 'text-gray-500'}">${item.exc}</td>
                        <td class="p-3 text-blue-400 font-semibold">${coinName}</td>
                        <td class="p-3 text-mu-gold font-bold">${item.price}</td>
                        <td class="p-3 text-right flex justify-end space-x-2">
                            <button onclick="loadEdit(${idx})" class="p-1.5 bg-blue-500/20 text-blue-400 rounded hover:bg-blue-500/40 transition" title="Editar">
                                <i class="fa-solid fa-pen-to-square"></i>
                            </button>
                            <button onclick="deleteRow(${idx})" class="p-1.5 bg-red-500/20 text-red-400 rounded hover:bg-red-500/40 transition" title="Borrar">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // --- SISTEMA DE EDICIÓN ---
        function loadEdit(idx) {
            editIndex = idx;
            const item = activeItems[idx];
            
            document.getElementById('shopTab').value = item.shopTab;
            document.getElementById('shopMenu').value = item.shopMenu;
            document.getElementById('itemType').value = item.itemType;
            
            updateFormUI(item.exc); // Actualiza opciones de index y setea checkboxes de excelentes

            // Manejar Index custom si no está en la base de datos
            let exists = Array.from(document.getElementById('itemIndex').options).some(opt => opt.value == item.itemIndex);
            if (!exists) {
                const newOpt = document.createElement('option');
                newOpt.value = item.itemIndex;
                newOpt.textContent = `${item.itemIndex} - Custom ID`;
                selItemIndex.insertBefore(newOpt, selItemIndex.querySelector('option[value="custom"]'));
            }
            document.getElementById('itemIndex').value = item.itemIndex;
            
            document.getElementById('level').value = item.level;
            document.getElementById('durability').value = item.durability;
            document.getElementById('skill').value = item.skill;
            document.getElementById('luck').value = item.luck;
            document.getElementById('option').value = item.option;
            document.getElementById('period').value = item.period;
            document.getElementById('coinType').value = item.coin;
            document.getElementById('price').value = item.price;

            // Cambiar interfaz al modo edición
            const btnSave = document.getElementById('btnSave');
            btnSave.innerHTML = `<i class="fa-solid fa-floppy-disk mr-2"></i> Guardar Cambios`;
            btnSave.className = "btn-glow-green flex-1 bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-bold py-3 rounded-xl";
            
            document.getElementById('btnCancelEdit').classList.remove('hidden-safe');
            document.getElementById('editBadge').classList.remove('hidden-safe');
            
            renderTable(); // Para marcar la fila seleccionada
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelEdit() {
            editIndex = -1;
            document.getElementById('shopForm').reset();
            updateFormUI();
            
            const btnSave = document.getElementById('btnSave');
            btnSave.innerHTML = `<i class="fa-solid fa-cart-plus mr-2"></i> Publicar Ítem en la Tienda`;
            btnSave.className = "btn-glow flex-1 bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold py-3 rounded-xl";
            
            document.getElementById('btnCancelEdit').classList.add('hidden-safe');
            document.getElementById('editBadge').classList.add('hidden-safe');
            renderTable();
        }

        function deleteRow(idx) {
            if (editIndex === idx) cancelEdit();
            activeItems.splice(idx, 1);
            if (editIndex > idx) editIndex--; // Ajustar índice si borraste uno de arriba
            renderTable();
        }

        // --- SISTEMA DE IMPORTACIÓN ---
        function importShopFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const lines = text.split('\n');
                
                // Opción para limpiar tabla actual o sumar ítems (aquí se limpia para cargar el archivo limpio)
                activeItems = []; 

                lines.forEach(line => {
                    line = line.trim();
                    if (!line || line.startsWith('//') || line.toLowerCase() === 'end') return;

                    const parts = line.split(/\s+/);
                    if (parts.length >= 14) { // Validar que la línea tiene las columnas requeridas de MuEmu
                        const cat = parseInt(parts[2]);
                        const idx = parseInt(parts[3]);
                        
                        let name = "Custom ID";
                        if (ITEM_DB[cat]) {
                            const found = ITEM_DB[cat].find(i => i.id === idx);
                            if (found) name = found.name;
                        }

                        activeItems.push({
                            shopTab: parts[0],
                            shopMenu: parts[1],
                            itemType: cat,
                            itemIndex: idx,
                            name: name,
                            level: parseInt(parts[4]),
                            durability: parseInt(parts[5]),
                            skill: parseInt(parts[6]),
                            luck: parseInt(parts[7]),
                            option: parseInt(parts[8]),
                            exc: parseInt(parts[9]),
                            period: parseInt(parts[11]), // El indice 10 es "Set" (siempre 0 por defecto)
                            coin: parts[12],
                            price: parts[13]
                        });
                    }
                });
                renderTable();
                event.target.value = ''; // Limpiar el input file
                alert("¡Archivo importado correctamente!");
            };
            reader.readAsText(file);
        }

        // --- SISTEMA DE EXPORTACIÓN ---
        function downloadShopFile() {
            if(activeItems.length === 0) return alert("Agregá al menos un ítem.");
            
            let txt = "//===========================================================================================\n";
            txt += "// InGameShop Config generado por MuEmu Cash Shop Interactive Pro\n";
            txt += "// Solapa  MenuIzq  CatItem  Index  Lvl  Dur  Skill  Luck  Opt  Exc  Set  Period  Coin  Price\n";
            txt += "//===========================================================================================\n";
            
            activeItems.forEach(i => {
                txt += `${i.shopTab}\t${i.shopMenu}\t${i.itemType}\t${i.itemIndex}\t${i.level}\t${i.durability}\t${i.skill}\t${i.luck}\t${i.option}\t${i.exc}\t0\t${i.period}\t${i.coin}\t${i.price}\n`;
            });
            txt += "end\n";

            const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = "InGameShop.txt";
            link.click();
        }
    </script>
