<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In-Game Shop (X) Avanzada - MuEmu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        mu: { dark: '#0a0a0f', card: '#12131a', border: '#2a2b3d', gold: '#d4af37', purple: '#a855f7' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'], title: ['Cinzel', 'serif'], mono: ['Fira Code', 'monospace'] }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0f; }
        ::-webkit-scrollbar-thumb { background: #2a2b3d; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #d4af37; }
        .btn-glow { box-shadow: 0 0 15px rgba(168, 85, 247, 0.4); transition: all 0.2s; }
        .btn-glow:hover { box-shadow: 0 0 25px rgba(168, 85, 247, 0.7); transform: translateY(-1px); }
        .btn-glow:active { transform: scale(0.98); }
        /* Ocultar elementos de forma segura con Tailwind */
        .hidden-safe { display: none !important; }
    </style>
</head>
<body class="bg-mu-dark text-gray-200 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-mu-card border-b border-mu-border sticky top-0 z-50 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-purple-600 to-indigo-800 flex items-center justify-center text-white text-xl shadow-md">
                    <i class="fa-solid fa-cart-shopping"></i>
                </div>
                <div>
                    <h1 class="font-title text-lg font-bold text-mu-purple">Cash Shop Interactive</h1>
                    <p class="text-xs text-gray-400 font-mono">Generador Avanzado In-Game</p>
                </div>
            </div>
            <a href="../index.html" class="px-3 py-1.5 text-sm font-bold bg-mu-border rounded-lg hover:text-mu-gold transition">
                <i class="fa-solid fa-house mr-1"></i> Inicio
            </a>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6 space-y-6">
        
        <!-- Interactive Form -->
        <div class="bg-mu-card border border-mu-border rounded-xl p-5 shadow-lg">
            <h2 class="font-title text-mu-gold font-bold mb-4 border-b border-mu-border pb-2 flex items-center">
                <i class="fa-solid fa-wand-magic-sparkles mr-2"></i> Configurar Nuevo Ítem
            </h2>
            
            <form id="shopForm" class="space-y-5">
                
                <!-- Row 1: Ubicación en Tienda y Selección de Ítem -->
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 p-4 bg-mu-dark/50 rounded-lg border border-mu-border/50">
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-1">Solapa de la Tienda</label>
                        <select id="section" class="w-full bg-mu-dark border border-mu-border rounded p-2 text-sm text-white focus:border-mu-purple outline-none">
                            <option value="1">1 - WCoins (Premium)</option>
                            <option value="2">2 - Goblin Points</option>
                            <option value="3">3 - Consumibles / Buffs</option>
                            <option value="4">4 - Mascotas / Pets</option>
                            <option value="5">5 - Paquetes Especiales</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-1">Categoría del Ítem</label>
                        <select id="category" class="w-full bg-mu-dark border border-mu-border rounded p-2 text-sm text-white focus:border-mu-purple outline-none">
                            <option value="0">0 - Espadas (Swords)</option>
                            <option value="1">1 - Hachas (Axes)</option>
                            <option value="2">2 - Mazos (Maces)</option>
                            <option value="4">4 - Arcos (Bows/Crossbows)</option>
                            <option value="5">5 - Bastones (Staffs)</option>
                            <option value="6">6 - Escudos (Shields)</option>
                            <option value="7">7 - Cascos (Helms)</option>
                            <option value="8">8 - Armaduras (Armors)</option>
                            <option value="9">9 - Pantalones (Pants)</option>
                            <option value="10">10 - Guantes (Gloves)</option>
                            <option value="11">11 - Botas (Boots)</option>
                            <option value="12">12 - Alas (Wings)</option>
                            <option value="13">13 - Anillos/Pets/Accesorios</option>
                            <option value="14" selected>14 - Joyas y Pociones</option>
                            <option value="15">15 - Scroll / Poderes</option>
                        </select>
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-xs font-semibold text-gray-400 mb-1">Seleccionar Ítem</label>
                        <select id="itemIndex" class="w-full bg-mu-dark border border-mu-border rounded p-2 text-sm text-white focus:border-mu-purple outline-none">
                            <!-- Inyectado por JS -->
                        </select>
                    </div>
                </div>

                <!-- Row 2: Stats Dinámicos -->
                <div id="statsContainer" class="grid grid-cols-2 md:grid-cols-6 gap-4 p-4 bg-mu-dark/50 rounded-lg border border-mu-border/50">
                    <div id="boxLevel">
                        <label class="block text-xs font-semibold text-gray-400 mb-1">Nivel (+0 a +15)</label>
                        <input type="number" id="level" value="0" min="0" max="15" class="w-full bg-mu-dark border border-mu-border rounded p-2 text-sm text-center text-white focus:border-mu-purple outline-none">
                    </div>
                    <div id="boxQuantity" class="hidden-safe">
                        <label class="block text-xs font-semibold text-emerald-400 mb-1">Cantidad / Dur</label>
                        <input type="number" id="durability" value="1" min="1" max="255" class="w-full bg-mu-dark border border-emerald-500/50 rounded p-2 text-sm text-center text-white focus:border-emerald-400 outline-none">
                    </div>
                    <div id="boxSkill">
                        <label class="block text-xs font-semibold text-gray-400 mb-1">Skill</label>
                        <select id="skill" class="w-full bg-mu-dark border border-mu-border rounded p-2 text-sm text-white">
                            <option value="0">No</option><option value="1">Sí</option>
                        </select>
                    </div>
                    <div id="boxLuck">
                        <label class="block text-xs font-semibold text-gray-400 mb-1">Luck</label>
                        <select id="luck" class="w-full bg-mu-dark border border-mu-border rounded p-2 text-sm text-white">
                            <option value="0">No</option><option value="1">Sí</option>
                        </select>
                    </div>
                    <div id="boxOption">
                        <label class="block text-xs font-semibold text-gray-400 mb-1">Opción (+4 a +28)</label>
                        <select id="option" class="w-full bg-mu-dark border border-mu-border rounded p-2 text-sm text-white">
                            <option value="0">+0</option><option value="1">+4</option><option value="2">+8</option>
                            <option value="3">+12</option><option value="4">+16</option><option value="5">+20</option>
                            <option value="6">+24</option><option value="7">+28</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-1" title="0 para infinito">Días (Periodo)</label>
                        <input type="number" id="period" value="0" min="0" class="w-full bg-mu-dark border border-mu-border rounded p-2 text-sm text-center text-white focus:border-mu-purple outline-none">
                    </div>
                </div>

                <!-- Row 3: Opciones Excelentes (Solo visible para armas/sets) -->
                <div id="excContainer" class="hidden-safe p-4 bg-mu-dark/50 rounded-lg border border-purple-500/30">
                    <label class="block text-xs font-bold text-mu-purple mb-3 uppercase tracking-wider">Opciones Excelentes (Selección Múltiple)</label>
                    <div id="excOptionsGrid" class="grid grid-cols-2 md:grid-cols-3 gap-3 text-sm">
                        <!-- Las opciones cambian si es arma o armadura vía JS -->
                    </div>
                </div>

                <!-- Row 4: Precio -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 p-4 bg-mu-dark/50 rounded-lg border border-mu-gold/30">
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-1">Moneda de Pago</label>
                        <select id="coinType" class="w-full bg-mu-dark border border-mu-border rounded p-2 text-sm text-white focus:border-mu-gold outline-none">
                            <option value="0">WCoinC (Donación)</option>
                            <option value="1">WCoinP</option>
                            <option value="2">Goblin Points (Juego)</option>
                        </select>
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-xs font-bold text-mu-gold mb-1">Precio Final</label>
                        <div class="flex">
                            <span class="inline-flex items-center px-3 bg-mu-border border border-r-0 border-mu-gold rounded-l-md text-gray-400">
                                <i class="fa-solid fa-coins text-mu-gold"></i>
                            </span>
                            <input type="number" id="price" class="flex-1 bg-mu-dark border border-mu-gold rounded-none rounded-r-md p-2 text-white font-bold focus:outline-none" required placeholder="Ej: 1500">
                        </div>
                    </div>
                </div>

                <!-- Submit -->
                <button type="button" id="btnSave" class="btn-glow w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold py-3 rounded-xl">
                    <i class="fa-solid fa-cart-plus mr-2"></i> Agregar Ítem a la Tienda
                </button>
            </form>
        </div>

        <!-- Table View -->
        <div class="bg-mu-card border border-mu-border rounded-xl shadow-lg overflow-hidden">
            <div class="p-4 border-b border-mu-border flex justify-between items-center">
                <h2 class="font-title text-gray-200 font-bold">Listado de Ventas</h2>
                <button onclick="downloadShopFile()" class="px-4 py-2 bg-mu-gold text-black font-bold text-xs rounded hover:bg-yellow-500 transition shadow-lg">
                    <i class="fa-solid fa-download mr-1"></i> Exportar InGameShop.txt
                </button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs font-mono text-gray-300">
                    <thead class="bg-mu-dark text-gray-400 uppercase tracking-wider border-b border-mu-border">
                        <tr>
                            <th class="p-3">Solapa</th>
                            <th class="p-3">Cat</th>
                            <th class="p-3">Index</th>
                            <th class="p-3">Nombre</th>
                            <th class="p-3">Lvl</th>
                            <th class="p-3">Cant/Dur</th>
                            <th class="p-3">Sk/Lk/Op</th>
                            <th class="p-3">Exc</th>
                            <th class="p-3 text-mu-gold">Moneda</th>
                            <th class="p-3 text-mu-gold">Precio</th>
                            <th class="p-3 text-right">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="shopTableBody" class="divide-y divide-mu-border/60">
                        <!-- Items inyectados -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // Base de Datos Extensa para mayor comodidad
        const ITEM_DB = {
            0: [ // Espadas
                {id: 0, name: "Kris"}, {id: 1, name: "Short Sword"}, {id: 2, name: "Rapier"}, {id: 3, name: "Katana"}, 
                {id: 4, name: "Sword of Assassin"}, {id: 5, name: "Blade"}, {id: 6, name: "Gladius"}, {id: 9, name: "Giant Sword"}, 
                {id: 11, name: "Legendary Sword"}, {id: 14, name: "Lightning Sword"}, {id: 16, name: "Sword of Destruction"}, 
                {id: 17, name: "Dark Reign Blade"}, {id: 19, name: "Archangel Sword"}, {id: 22, name: "Bone Blade"}, 
                {id: 31, name: "XP Sword"}, {id: 35, name: "Daybreak"}
            ],
            1: [ // Hachas
                {id: 0, name: "Small Axe"}, {id: 1, name: "Hand Axe"}, {id: 2, name: "Double Axe"}, {id: 3, name: "Tomahawk"}, 
                {id: 6, name: "Battle Axe"}, {id: 7, name: "Nikkea Axe"}, {id: 8, name: "Larkan Axe"}, {id: 9, name: "Crescent Axe"}
            ],
            2: [ // Mazos y Cetros
                {id: 0, name: "Mace"}, {id: 1, name: "Morning Star"}, {id: 3, name: "Great Hammer"}, {id: 4, name: "Crystal Mace"}, 
                {id: 11, name: "Lord Scepter"}, {id: 12, name: "Great Lord Scepter"}, {id: 13, name: "Archangel Scepter"}, 
                {id: 14, name: "Mace of the King"}
            ],
            4: [ // Arcos y Ballestas
                {id: 0, name: "Short Bow"}, {id: 1, name: "Bow"}, {id: 2, name: "Elven Bow"}, {id: 3, name: "Battle Bow"}, 
                {id: 4, name: "Tiger Bow"}, {id: 5, name: "Silver Bow"}, {id: 6, name: "Chaos Nature Bow"}, {id: 17, name: "Albatross Bow"}, 
                {id: 18, name: "Archangel Bow"}, {id: 20, name: "Viper Bow"}, {id: 21, name: "Sylph Wind Bow"}
            ],
            5: [ // Bastones
                {id: 0, name: "Skull Staff"}, {id: 1, name: "Angelic Staff"}, {id: 2, name: "Serpent Staff"}, {id: 3, name: "Thunder Staff"}, 
                {id: 4, name: "Gorgon Staff"}, {id: 5, name: "Legendary Staff"}, {id: 6, name: "Resurrection Staff"}, 
                {id: 7, name: "Chaos Lightning Staff"}, {id: 8, name: "Staff of Destruction"}, {id: 9, name: "Dragon Soul Staff"}, 
                {id: 10, name: "Archangel Staff"}, {id: 11, name: "Kundun Staff"}, {id: 12, name: "Platina Wing Staff"}
            ],
            6: [ // Escudos
                {id: 0, name: "Small Shield"}, {id: 1, name: "Horn Shield"}, {id: 2, name: "Kite Shield"}, {id: 3, name: "Elven Shield"}, 
                {id: 4, name: "Buckler"}, {id: 9, name: "Plate Shield"}, {id: 10, name: "Large Round Shield"}, {id: 11, name: "Dragon Shield"}, 
                {id: 12, name: "Legendary Shield"}, {id: 13, name: "Grand Soul Shield"}, {id: 14, name: "Chaos Dragon Shield"}, 
                {id: 15, name: "Crimson Glory Shield"}
            ],
            7: [ // Cascos
                {id: 0, name: "Pad Helm"}, {id: 1, name: "Bone Helm"}, {id: 2, name: "Sphinx Helm"}, {id: 4, name: "Legendary Helm"}, 
                {id: 5, name: "Leather Helm"}, {id: 6, name: "Bronze Helm"}, {id: 7, name: "Scale Helm"}, {id: 8, name: "Brass Helm"}, 
                {id: 9, name: "Plate Helm"}, {id: 11, name: "Dragon Helm"}, {id: 16, name: "Black Dragon Helm"}, 
                {id: 17, name: "Dark Phoenix Helm"}, {id: 21, name: "Great Dragon Helm"}, {id: 29, name: "Dark Soul Helm"}
            ],
            8: [ // Armaduras
                {id: 0, name: "Pad Armor"}, {id: 1, name: "Bone Armor"}, {id: 4, name: "Legendary Armor"}, {id: 5, name: "Leather Armor"}, 
                {id: 9, name: "Plate Armor"}, {id: 11, name: "Dragon Armor"}, {id: 16, name: "Black Dragon Armor"}, 
                {id: 17, name: "Dark Phoenix Armor"}, {id: 21, name: "Great Dragon Armor"}, {id: 29, name: "Dark Soul Armor"}
            ],
            9: [ // Pantalones
                {id: 0, name: "Pad Pants"}, {id: 1, name: "Bone Pants"}, {id: 4, name: "Legendary Pants"}, {id: 5, name: "Leather Pants"}, 
                {id: 9, name: "Plate Pants"}, {id: 11, name: "Dragon Pants"}, {id: 16, name: "Black Dragon Pants"}, 
                {id: 17, name: "Dark Phoenix Pants"}, {id: 21, name: "Great Dragon Pants"}, {id: 29, name: "Dark Soul Pants"}
            ],
            10: [ // Guantes
                {id: 0, name: "Pad Gloves"}, {id: 1, name: "Bone Gloves"}, {id: 4, name: "Legendary Gloves"}, {id: 5, name: "Leather Gloves"}, 
                {id: 9, name: "Plate Gloves"}, {id: 11, name: "Dragon Gloves"}, {id: 16, name: "Black Dragon Gloves"}, 
                {id: 17, name: "Dark Phoenix Gloves"}, {id: 21, name: "Great Dragon Gloves"}, {id: 29, name: "Dark Soul Gloves"}
            ],
            11: [ // Botas
                {id: 0, name: "Pad Boots"}, {id: 1, name: "Bone Boots"}, {id: 4, name: "Legendary Boots"}, {id: 5, name: "Leather Boots"}, 
                {id: 9, name: "Plate Boots"}, {id: 11, name: "Dragon Boots"}, {id: 16, name: "Black Dragon Boots"}, 
                {id: 17, name: "Dark Phoenix Boots"}, {id: 21, name: "Great Dragon Boots"}, {id: 29, name: "Dark Soul Boots"}
            ],
            12: [ // Alas
                {id: 0, name: "Wings of Elf"}, {id: 1, name: "Wings of Heaven"}, {id: 2, name: "Wings of Satan"}, 
                {id: 3, name: "Wings of Spirits"}, {id: 4, name: "Wings of Soul"}, {id: 5, name: "Wings of Dragon"}, 
                {id: 36, name: "Cape of Lord"}, {id: 37, name: "Wings of Illusion"}, {id: 38, name: "Wings of Hurricane"}, 
                {id: 39, name: "Wings of Storm"}, {id: 40, name: "Mantle of Monarch"}
            ],
            13: [ // Anillos y Pets
                {id: 0, name: "Guardian Angel"}, {id: 1, name: "Imp"}, {id: 2, name: "Horn of Uniria"}, {id: 3, name: "Horn of Dinorant"}, 
                {id: 4, name: "Dark Horse"}, {id: 5, name: "Dark Raven"}, {id: 8, name: "Ring of Ice"}, {id: 9, name: "Ring of Poison"}, 
                {id: 12, name: "Pendant of Lightning"}, {id: 13, name: "Pendant of Fire"}, {id: 14, name: "Loch's Feather"}, 
                {id: 20, name: "Wizards Ring"}, {id: 37, name: "Horn of Fenrir"}
            ],
            14: [ // Joyas y Pociones
                {id: 13, name: "Jewel of Bless"}, {id: 14, name: "Jewel of Soul"}, {id: 16, name: "Jewel of Life"}, 
                {id: 15, name: "Jewel of Chaos"}, {id: 22, name: "Jewel of Creation"}, {id: 31, name: "Jewel of Guardian"},
                {id: 42, name: "Jewel of Harmony"}, {id: 0, name: "Apple"}, {id: 1, name: "Small Healing Potion"}, 
                {id: 2, name: "Medium Healing Potion"}, {id: 3, name: "Large Healing Potion"}
            ],
            15: [ // Scrolls y Poderes
                {id: 0, name: "Scroll of Poison"}, {id: 1, name: "Scroll of Meteorite"}, {id: 2, name: "Scroll of Lightning"}, 
                {id: 3, name: "Scroll of Fire Ball"}, {id: 9, name: "Scroll of Evil Spirit"}, {id: 10, name: "Scroll of Hellfire"}, 
                {id: 16, name: "Scroll of Decay"}, {id: 17, name: "Scroll of Ice Storm"}, {id: 18, name: "Scroll of Nova"}
            ]
        };

        const EXC_ARMOR_OPTIONS = [
            {val: 1, label: "Zen Drop +30%"},
            {val: 2, label: "Defense Success Rate +10%"},
            {val: 4, label: "Reflect Damage +5%"},
            {val: 8, label: "Damage Decrease +4%"},
            {val: 16, label: "Max Mana +4%"},
            {val: 32, label: "Max HP +4%"}
        ];

        const EXC_WEAPON_OPTIONS = [
            {val: 1, label: "Mob Kill +Mana/8"},
            {val: 2, label: "Mob Kill +Life/8"},
            {val: 4, label: "Attack Speed +7"},
            {val: 8, label: "Damage +2%"},
            {val: 16, label: "Damage +Level/20"},
            {val: 32, label: "Exc Damage Rate +10%"}
        ];

        let activeItems = [];

        // Referencias del DOM centralizadas
        const selCategory = document.getElementById('category');
        const selItemIndex = document.getElementById('itemIndex');
        const boxSkill = document.getElementById('boxSkill');
        const boxLuck = document.getElementById('boxLuck');
        const boxOption = document.getElementById('boxOption');
        const boxLevel = document.getElementById('boxLevel');
        const boxQuantity = document.getElementById('boxQuantity');
        const excContainer = document.getElementById('excContainer');
        const excGrid = document.getElementById('excOptionsGrid');

        // Inicializar eventos
        document.addEventListener('DOMContentLoaded', () => {
            selCategory.addEventListener('change', updateItemsUI);
            selItemIndex.addEventListener('change', handleManualInput);
            document.getElementById('btnSave').addEventListener('click', saveItem);
            
            // Forzar actualización inicial
            updateItemsUI();
        });

        // Evento para el campo "+ Ingresar ID Manual"
        function handleManualInput(e) {
            if(e.target.value === "custom") {
                const manualId = prompt("Ingresá el ID numérico del ítem (Index):");
                if(manualId && !isNaN(manualId)) {
                    const newOpt = document.createElement('option');
                    newOpt.value = manualId;
                    newOpt.textContent = `${manualId} - Custom ID`;
                    newOpt.selected = true;
                    // Insertar antes del custom
                    selItemIndex.insertBefore(newOpt, selItemIndex.querySelector('option[value="custom"]'));
                } else {
                    selItemIndex.selectedIndex = 0;
                }
            }
        }

        // Sistema de Cajas Inteligentes
        function updateItemsUI() {
            const cat = parseInt(selCategory.value);
            
            // 1. Cargar la lista de Ítems según la categoría
            selItemIndex.innerHTML = "";
            const itemsList = ITEM_DB[cat] || [{id: 0, name: "Ítem Personalizado"}];
            
            itemsList.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item.id;
                opt.textContent = `${item.id} - ${item.name}`;
                selItemIndex.appendChild(opt);
            });

            // Opción custom siempre al final
            const customOpt = document.createElement('option');
            customOpt.value = "custom";
            customOpt.textContent = "+ Ingresar ID Manual...";
            selItemIndex.appendChild(customOpt);

            // 2. Definir Grupos de Ocultamiento
            const isJewelOrConsumable = (cat === 14 || cat === 15);
            const isArmor = (cat >= 6 && cat <= 11);
            const isWeapon = (cat >= 0 && cat <= 5);
            const isRingOrPet = (cat === 13);
            const isWing = (cat === 12);

            // Mostrar/Ocultar Skill, Luck, Option, Level
            if (isJewelOrConsumable) {
                boxSkill.classList.add('hidden-safe');
                boxLuck.classList.add('hidden-safe');
                boxOption.classList.add('hidden-safe');
                boxLevel.classList.add('hidden-safe');
                boxQuantity.classList.remove('hidden-safe');
            } else {
                boxSkill.classList.remove('hidden-safe');
                boxLuck.classList.remove('hidden-safe');
                boxOption.classList.remove('hidden-safe');
                boxLevel.classList.remove('hidden-safe');
                
                // Los anillos/pets a veces usan durabilidad
                if(isRingOrPet) {
                    boxQuantity.classList.remove('hidden-safe');
                } else {
                    boxQuantity.classList.add('hidden-safe');
                }
            }

            // Mostrar/Ocultar Menú de Opciones Excelentes
            if (isWeapon || isArmor || isRingOrPet) {
                excContainer.classList.remove('hidden-safe');
                excGrid.innerHTML = '';
                
                // Definir qué tipo de opciones mostrar
                const optionsArray = (isArmor || isRingOrPet) ? EXC_ARMOR_OPTIONS : EXC_WEAPON_OPTIONS;
                
                optionsArray.forEach(op => {
                    excGrid.innerHTML += `
                        <label class="flex items-center space-x-2 text-gray-300 cursor-pointer hover:text-white">
                            <input type="checkbox" class="exc-checkbox form-checkbox rounded bg-mu-dark border-mu-border text-mu-purple focus:ring-mu-purple" value="${op.val}">
                            <span>${op.label}</span>
                        </label>
                    `;
                });
            } else {
                excContainer.classList.add('hidden-safe');
                excGrid.innerHTML = '';
            }
        }

        // Guardar en la tabla
        function saveItem() {
            // Validación de precio
            const priceInput = document.getElementById('price');
            if(!priceInput.value) {
                alert("Por favor ingresá un precio válido.");
                priceInput.focus();
                return;
            }

            const cat = parseInt(selCategory.value);
            
            // Sumar checkboxes Excelentes
            let excValue = 0;
            document.querySelectorAll('.exc-checkbox:checked').forEach(cb => {
                excValue += parseInt(cb.value);
            });

            // Extraer nombre limpio (sin el ID)
            const selectedText = selItemIndex.options[selItemIndex.selectedIndex].text;
            const itemName = selectedText.includes(' - ') ? selectedText.split(' - ')[1] : selectedText;

            const isJewel = (cat === 14 || cat === 15);

            const newItem = {
                section: document.getElementById('section').value,
                category: cat,
                index: selItemIndex.value,
                name: itemName,
                level: isJewel ? 0 : document.getElementById('level').value,
                durability: (isJewel || cat === 13) ? document.getElementById('durability').value : 0,
                skill: isJewel ? 0 : document.getElementById('skill').value,
                luck: isJewel ? 0 : document.getElementById('luck').value,
                option: isJewel ? 0 : document.getElementById('option').value,
                exc: excValue,
                period: document.getElementById('period').value,
                coin: document.getElementById('coinType').value,
                price: priceInput.value
            };

            activeItems.push(newItem);
            renderTable();
            
            // Resetear el formulario limpiamente y sincronizar la UI
            document.getElementById('shopForm').reset();
            updateItemsUI(); // ¡Esto vuelve a poner las opciones ocultas para las joyas!
        }

        // Imprimir la tabla
        function renderTable() {
            const tbody = document.getElementById('shopTableBody');
            tbody.innerHTML = activeItems.map((item, idx) => {
                const coinName = item.coin == 0 ? "WCoinC" : (item.coin == 1 ? "WCoinP" : "GoblinP");
                
                return `
                    <tr class="hover:bg-mu-border/30 transition">
                        <td class="p-3 font-bold text-mu-purple">${item.section}</td>
                        <td class="p-3">${item.category}</td>
                        <td class="p-3">${item.index}</td>
                        <td class="p-3 text-white font-semibold truncate max-w-[140px]">${item.name}</td>
                        <td class="p-3">+${item.level}</td>
                        <td class="p-3 text-emerald-400">${item.durability > 0 ? item.durability : '-'}</td>
                        <td class="p-3 text-gray-400">${item.skill}/${item.luck}/${item.option}</td>
                        <td class="p-3 ${item.exc > 0 ? 'text-green-400 font-bold' : 'text-gray-500'}">${item.exc}</td>
                        <td class="p-3 text-blue-400 font-semibold">${coinName}</td>
                        <td class="p-3 text-mu-gold font-bold">${item.price}</td>
                        <td class="p-3 text-right">
                            <button onclick="deleteRow(${idx})" class="p-1.5 bg-red-500/20 text-red-400 rounded hover:bg-red-500/40 transition">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function deleteRow(idx) {
            activeItems.splice(idx, 1);
            renderTable();
        }

        // Descargar archivo tabulado para el VPS
        function downloadShopFile() {
            if(activeItems.length === 0) {
                alert("Agregá al menos un ítem a la lista para exportar.");
                return;
            }
            
            let txt = "//=========================================================================\n";
            txt += "// InGameShop Config generado por MuEmu Cash Shop Interactive\n";
            txt += "// Sec  Cat  Index  Lvl  Dur  Skill  Luck  Opt  Exc  Set  Period  Coin  Price\n";
            txt += "//=========================================================================\n";
            
            activeItems.forEach(i => {
                txt += `${i.section}\t${i.category}\t${i.index}\t${i.level}\t${i.durability}\t${i.skill}\t${i.luck}\t${i.option}\t${i.exc}\t0\t${i.period}\t${i.coin}\t${i.price}\n`;
            });
            txt += "end\n";

            const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = "InGameShop_Generada.txt";
            link.click();
        }
    </script>
</body>
</html>
