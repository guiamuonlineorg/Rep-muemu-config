<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In-Game Shop (X) Avanzada - MuEmu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        mu: { dark: '#0a0a0f', card: '#12131a', border: '#2a2b3d', gold: '#d4af37', purple: '#a855f7' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'], title: ['Cinzel', 'serif'], mono: ['Fira Code', 'monospace'] }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0f; }
        ::-webkit-scrollbar-thumb { background: #2a2b3d; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #d4af37; }
        .btn-glow { box-shadow: 0 0 15px rgba(168, 85, 247, 0.4); transition: all 0.2s; }
        .btn-glow:hover { box-shadow: 0 0 25px rgba(168, 85, 247, 0.7); transform: translateY(-1px); }
        .btn-glow:active { transform: scale(0.98); }
    </style>
</head>
<body class="bg-mu-dark text-gray-200 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-mu-card border-b border-mu-border sticky top-0 z-50 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-purple-600 to-indigo-800 flex items-center justify-center text-white text-xl shadow-md">
                    <i class="fa-solid fa-cart-shopping"></i>
                </div>
                <div>
                    <h1 class="font-title text-lg font-bold text-mu-purple">Cash Shop Interactive</h1>
                    <p class="text-xs text-gray-400 font-mono">Generador Avanzado In-Game</p>
                </div>
            </div>
            <a href="../index.html" class="px-3 py-1.5 text-sm font-bold bg-mu-border rounded-lg hover:text-mu-gold transition">
                <i class="fa-solid fa-house mr-1"></i> Inicio
            </a>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6 space-y-6">
        
        <!-- Interactive Form -->
        <div class="bg-mu-card border border-mu-border rounded-xl p-5 shadow-lg">
            <h2 class="font-title text-mu-gold font-bold mb-4 border-b border-mu-border pb-2 flex items-center">
                <i class="fa-solid fa-wand-magic-sparkles mr-2"></i> Configurar Nuevo Ítem
            </h2>
            
            <form id="shopForm" onsubmit="saveItem(event)" class="space-y-5">
                
                <!-- Row 1: Ubicación en Tienda y Selección de Ítem -->
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 p-4 bg-mu-dark/50 rounded-lg border border-mu-border/50">
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-1">Solapa de la Tienda</label>
                        <select id="section" class="w-full bg-mu-dark border border-mu-border rounded p-2 text-sm text-white focus:border-mu-purple outline-none">
                            <option value="1">1 - WCoins (Premium)</option>
                            <option value="2">2 - Goblin Points</option>
                            <option value="3">3 - Consumibles / Buffs</option>
                            <option value="4">4 - Mascotas / Pets</option>
                            <option value="5">5 - Paquetes Especiales</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-1">Categoría del Ítem</label>
                        <select id="category" onchange="updateItemsUI()" class="w-full bg-mu-dark border border-mu-border rounded p-2 text-sm text-white focus:border-mu-purple outline-none">
                            <option value="0">0 - Espadas (Swords)</option>
                            <option value="1">1 - Hachas (Axes)</option>
                            <option value="2">2 - Mazos (Maces)</option>
                            <option value="4">4 - Arcos (Bows/Crossbows)</option>
                            <option value="5">5 - Bastones (Staffs)</option>
                            <option value="6">6 - Escudos (Shields)</option>
                            <option value="7">7 - Cascos (Helms)</option>
                            <option value="8">8 - Armaduras (Armors)</option>
                            <option value="9">9 - Pantalones (Pants)</option>
                            <option value="10">10 - Guantes (Gloves)</option>
                            <option value="11">11 - Botas (Boots)</option>
                            <option value="12">12 - Alas (Wings)</option>
                            <option value="13">13 - Anillos/Pets</option>
                            <option value="14" selected>14 - Joyas y Pociones</option>
                            <option value="15">15 - Scroll / Poderes</option>
                        </select>
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-xs font-semibold text-gray-400 mb-1">Seleccionar Ítem</label>
                        <select id="itemIndex" class="w-full bg-mu-dark border border-mu-border rounded p-2 text-sm text-white focus:border-mu-purple outline-none">
                            <!-- Inyectado por JS -->
                        </select>
                    </div>
                </div>

                <!-- Row 2: Stats Dinámicos -->
                <div id="statsContainer" class="grid grid-cols-2 md:grid-cols-6 gap-4 p-4 bg-mu-dark/50 rounded-lg border border-mu-border/50">
                    <div id="boxLevel">
                        <label class="block text-xs font-semibold text-gray-400 mb-1">Nivel (+0 a +15)</label>
                        <input type="number" id="level" value="0" min="0" max="15" class="w-full bg-mu-dark border border-mu-border rounded p-2 text-sm text-center text-white focus:border-mu-purple outline-none">
                    </div>
                    <div id="boxQuantity">
                        <label class="block text-xs font-semibold text-emerald-400 mb-1">Cantidad / Durabilidad</label>
                        <input type="number" id="durability" value="1" min="1" max="255" class="w-full bg-mu-dark border border-emerald-500/50 rounded p-2 text-sm text-center text-white focus:border-emerald-400 outline-none">
                    </div>
                    <div id="boxSkill">
                        <label class="block text-xs font-semibold text-gray-400 mb-1">Skill</label>
                        <select id="skill" class="w-full bg-mu-dark border border-mu-border rounded p-2 text-sm text-white">
                            <option value="0">No</option><option value="1">Sí</option>
                        </select>
                    </div>
                    <div id="boxLuck">
                        <label class="block text-xs font-semibold text-gray-400 mb-1">Luck</label>
                        <select id="luck" class="w-full bg-mu-dark border border-mu-border rounded p-2 text-sm text-white">
                            <option value="0">No</option><option value="1">Sí</option>
                        </select>
                    </div>
                    <div id="boxOption">
                        <label class="block text-xs font-semibold text-gray-400 mb-1">Opción (+4 a +28)</label>
                        <select id="option" class="w-full bg-mu-dark border border-mu-border rounded p-2 text-sm text-white">
                            <option value="0">+0</option><option value="1">+4</option><option value="2">+8</option>
                            <option value="3">+12</option><option value="4">+16</option><option value="5">+20</option>
                            <option value="6">+24</option><option value="7">+28</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-1" title="0 para infinito">Días (Periodo)</label>
                        <input type="number" id="period" value="0" min="0" class="w-full bg-mu-dark border border-mu-border rounded p-2 text-sm text-center text-white focus:border-mu-purple outline-none">
                    </div>
                </div>

                <!-- Row 3: Opciones Excelentes (Solo visible para armas/sets) -->
                <div id="excContainer" class="hidden p-4 bg-mu-dark/50 rounded-lg border border-purple-500/30">
                    <label class="block text-xs font-bold text-mu-purple mb-3 uppercase tracking-wider">Opciones Excelentes (Selección Múltiple)</label>
                    <div id="excOptionsGrid" class="grid grid-cols-2 md:grid-cols-3 gap-3 text-sm">
                        <!-- Las opciones cambian si es arma o armadura vía JS -->
                    </div>
                </div>

                <!-- Row 4: Precio -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 p-4 bg-mu-dark/50 rounded-lg border border-mu-gold/30">
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-1">Moneda de Pago</label>
                        <select id="coinType" class="w-full bg-mu-dark border border-mu-border rounded p-2 text-sm text-white focus:border-mu-gold outline-none">
                            <option value="0">WCoinC (Donación)</option>
                            <option value="1">WCoinP</option>
                            <option value="2">Goblin Points (Juego)</option>
                        </select>
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-xs font-bold text-mu-gold mb-1">Precio Final</label>
                        <div class="flex">
                            <span class="inline-flex items-center px-3 bg-mu-border border border-r-0 border-mu-gold rounded-l-md text-gray-400">
                                <i class="fa-solid fa-coins text-mu-gold"></i>
                            </span>
                            <input type="number" id="price" class="flex-1 bg-mu-dark border border-mu-gold rounded-none rounded-r-md p-2 text-white font-bold focus:outline-none" required placeholder="Ej: 1500">
                        </div>
                    </div>
                </div>

                <!-- Submit -->
                <button type="submit" class="btn-glow w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold py-3 rounded-xl">
                    <i class="fa-solid fa-cart-plus mr-2"></i> Agregar Ítem a la Tienda
                </button>
            </form>
        </div>

        <!-- Table View -->
        <div class="bg-mu-card border border-mu-border rounded-xl shadow-lg overflow-hidden">
            <div class="p-4 border-b border-mu-border flex justify-between items-center">
                <h2 class="font-title text-gray-200 font-bold">Listado de Ventas</h2>
                <button onclick="downloadShopFile()" class="px-4 py-2 bg-mu-gold text-black font-bold text-xs rounded hover:bg-yellow-500 transition shadow-lg">
                    <i class="fa-solid fa-download mr-1"></i> Exportar InGameShop.txt
                </button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs font-mono text-gray-300">
                    <thead class="bg-mu-dark text-gray-400 uppercase tracking-wider border-b border-mu-border">
                        <tr>
                            <th class="p-3">Solapa</th>
                            <th class="p-3">Cat</th>
                            <th class="p-3">Index</th>
                            <th class="p-3">Nombre</th>
                            <th class="p-3">Lvl</th>
                            <th class="p-3">Cant/Dur</th>
                            <th class="p-3">Sk/Lk/Op</th>
                            <th class="p-3">Exc</th>
                            <th class="p-3 text-mu-gold">Moneda</th>
                            <th class="p-3 text-mu-gold">Precio</th>
                            <th class="p-3 text-right">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="shopTableBody" class="divide-y divide-mu-border/60">
                        <!-- Items inyectados -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // Mini Base de Datos de Ítems Comunes (Se puede expandir fácilmente)
        const ITEM_DB = {
            0: [{id: 0, name: "Kris"}, {id: 22, name: "Bone Blade"}, {id: 31, name: "XP Sword"}],
            1: [{id: 0, name: "Small Axe"}, {id: 17, name: "Rune Blade"}],
            2: [{id: 0, name: "Mace"}, {id: 14, name: "Mace of the King"}],
            4
